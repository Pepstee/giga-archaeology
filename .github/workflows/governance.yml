name: Governance gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install the verified test tools
        run: python -m pip install pytest==9.0.3 ruff==0.15.15

      - name: Verify derived agent payloads
        run: python scripts/verify_derived_agent_payloads.py

      - name: Run the portable root test suite
        # The four prediction-automation tests require the separately certified,
        # private prediction-ledger repository. They remain part of the local
        # affected-system gate and are not copied into this repository for CI.
        run: python -m pytest -q tests --ignore=tests/test_prediction_automation.py

      - name: Lint the governed Python surface
        run: >-
          python -m ruff check
          scripts/verify_derived_agent_payloads.py
          tests/test_derived_agent_payloads.py
          tests/test_lineage.py
          twin_core/lineage.py

      - name: Check formatting of the governed Python surface
        run: >-
          python -m ruff format --check
          scripts/verify_derived_agent_payloads.py
          tests/test_derived_agent_payloads.py
          tests/test_lineage.py
          twin_core/lineage.py

      - name: Check the proposed Git delta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="HEAD^"
          fi
          git diff --check "$base_sha"...HEAD
