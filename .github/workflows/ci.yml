name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "modules/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "modules/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: archaeology-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Install project and test dependencies
        run: python -m pip install ".[test]"
      - name: Run full test suite on Linux and macOS
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - name: Verify supported scan workflow on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows_supported_path.py
      - name: Build wheel and source archive (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build==1.6.1
          python -m build --no-isolation --wheel --sdist --outdir dist
      - name: Install and smoke-test built wheel (Python 3.12)
        if: matrix.python-version == '3.12'
        run: >-
          python -c 'import os, pathlib, subprocess, sys; env=pathlib.Path(".wheel-smoke");
          subprocess.run([sys.executable,"-m","venv",str(env)],check=True);
          py=env/("Scripts/python.exe" if os.name=="nt" else "bin/python");
          cli=env/("Scripts/giga-archaeology.exe" if os.name=="nt" else "bin/giga-archaeology");
          wheel=next(pathlib.Path("dist").glob("*.whl"));
          subprocess.run([str(py),"-m","pip","install",str(wheel)],check=True);
          subprocess.run([str(py),"-m","pip","check"],check=True);
          subprocess.run([str(cli),"--help"],check=True)'
      - name: Install and smoke-test built source archive (Python 3.12)
        if: matrix.python-version == '3.12'
        run: >-
          python -c 'import os, pathlib, subprocess, sys; env=pathlib.Path(".sdist-smoke");
          subprocess.run([sys.executable,"-m","venv",str(env)],check=True);
          py=env/("Scripts/python.exe" if os.name=="nt" else "bin/python");
          cli=env/("Scripts/giga-archaeology.exe" if os.name=="nt" else "bin/giga-archaeology");
          archive=next(pathlib.Path("dist").glob("*.tar.gz"));
          subprocess.run([str(py),"-m","pip","install",str(archive)],check=True);
          subprocess.run([str(py),"-m","pip","check"],check=True);
          subprocess.run([str(cli),"--help"],check=True)'
