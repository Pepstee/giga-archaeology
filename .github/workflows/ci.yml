name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test runner
        run: python -m pip install --upgrade pip pytest .

      - name: Run test suite
        run: python -m pytest -q

      - name: Check installed dependencies
        run: python -m pip check

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Install built wheel and check CLI entry point
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('giga_archaeology-*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
          giga-archaeology --help
