[build-system]
requires = []
build-backend = "archaeology_build_backend"
backend-path = ["modules/platform/packaging"]

[project]
name = "giga-archaeology"
version = "0.1.3b1"
description = "Deterministic Python repository maps and source-linked context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
giga = ["giga-user-control-plane==0.1.0"]

[project.scripts]
giga-archaeology = "modules.operations.scripts.archaeology:main"
