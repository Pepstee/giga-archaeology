[build-system]
requires = []
build-backend = "archaeology_build_backend"
backend-path = ["modules/platform/packaging"]

[project]
name = "giga-archaeology"
version = "0.1.3b4"
description = "Deterministic Python repository maps and source-linked context"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["repository-analysis", "source-mapping", "static-analysis", "coding-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.urls]
Repository = "https://github.com/Pepstee/giga-archaeology"
Issues = "https://github.com/Pepstee/giga-archaeology/issues"

[project.optional-dependencies]
giga = ["giga-user-control-plane==0.1.0"]
test = [
    "pytest==9.1.1",
    "graphifyy==0.7.10",
]

[project.scripts]
giga-archaeology = "modules.operations.scripts.archaeology:main"
giga-archaeologist = "modules.operations.scripts.archaeologist:main"
