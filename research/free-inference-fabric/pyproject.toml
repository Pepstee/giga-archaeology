[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giga-inference-fabric"
version = "0.3.0"
description = "Provider-neutral laboratory for cheap-model ensembles and evidence-gated repair loops"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
giga-inference = "giga_inference_fabric.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
